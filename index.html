<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League HQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#0a0a0c;
    --field2:#131316;
    --field3:#1c1c20;
    --chalk:#eceef0;
    --chalk-dim:#9a9ca3;
    --chalk-dimmer:#6c6e75;
    --gold:#6fa8f5;
    --gold-dim:#4c76ad;
    --crimson:#e2626b;
    --line:rgba(236,238,240,0.09);
    --line-strong:rgba(236,238,240,0.16);
    --radius:2px;
    --maxw:1320px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--field);
    color:var(--chalk);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    text-transform:uppercase;
    color:var(--chalk);
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}

  /* ---------- masthead ---------- */
  .masthead{
    border-bottom:1px solid var(--line-strong);
    background:linear-gradient(180deg, var(--field2), var(--field));
    padding:36px 0 0;
  }
  .masthead-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:22px;}
  .masthead-title{display:flex;align-items:center;gap:16px;}
  .league-logo{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--gold-dim);background:var(--field3);flex-shrink:0;}
  .league-name{font-size:clamp(32px,6vw,56px);line-height:0.95;}
  .league-sub{color:var(--chalk-dim);font-size:13px;letter-spacing:0.04em;margin-top:8px;}
  .season-pill{
    border:1px solid var(--gold-dim);
    color:var(--gold);
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
  }
  nav.tabs{display:flex;gap:0;border-top:1px solid var(--line);}
  nav.tabs a{
    padding:14px 20px;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--chalk-dim);
    border-right:1px solid var(--line);
    position:relative;
  }
  nav.tabs a:first-child{padding-left:0;}
  nav.tabs a.active{color:var(--gold);}
  nav.tabs a.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold);
  }

  main{padding:34px 0 80px;}

  /* ---------- loading / error ---------- */
  .loading-screen{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
  .loading-screen .display{font-size:22px;color:var(--gold);}
  .loading-screen .msg{color:var(--chalk-dim);font-size:14px;min-height:18px;}
  .spinner{width:28px;height:28px;border:3px solid var(--line-strong);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{max-width:520px;margin:60px auto;text-align:center;border:1px solid var(--crimson);padding:28px;}
  .error-box h2{color:var(--crimson);font-size:22px;margin-bottom:10px;}
  .error-box p{color:var(--chalk-dim);font-size:14px;line-height:1.6;}

  /* ---------- standings ---------- */
  .panel-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .toggle-group{display:flex;border:1px solid var(--line-strong);}
  .toggle-group button{
    background:transparent;border:none;color:var(--chalk-dim);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em;
  }
  .toggle-group button.active{background:var(--gold);color:var(--field);}
  .standings-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.standings{width:100%;border-collapse:collapse;font-size:14px;}
  table.standings th:first-child,table.standings td:first-child{position:sticky;left:0;background:var(--field);z-index:2;width:44px;}
  table.standings th:nth-child(2),table.standings td:nth-child(2){position:sticky;left:44px;background:var(--field);z-index:2;box-shadow:3px 0 6px -2px rgba(0,0,0,0.5);}
  table.standings tbody tr:hover td:first-child,table.standings tbody tr:hover td:nth-child(2){background:#17140f;}
  table.standings tbody tr.wildcard-row td:first-child,table.standings tbody tr.wildcard-row td:nth-child(2){background:#1c1a10;}
  table.standings thead th{
    text-align:left;color:var(--chalk-dimmer);font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
    padding:0 10px 10px;border-bottom:1px solid var(--line-strong);
  }
  table.standings thead th.sortable{cursor:pointer;user-select:none;}
  table.standings thead th.sortable:hover{color:var(--chalk-dim);}
  table.standings thead th.sort-active{color:var(--gold);}
  table.standings td{padding:12px 10px;border-bottom:1px dashed var(--line);vertical-align:middle;}
  table.standings tbody tr{cursor:pointer;transition:background .12s;}
  table.standings tbody tr:hover{background:rgba(231,184,78,0.06);}
  .rank-chip{
    color:var(--chalk);font-weight:700;font-size:16px;font-family:'Anton',sans-serif;letter-spacing:.02em;
  }
  .rank-chip.rank-glyph{font-size:20px;font-weight:400;}
  .standings-divider td{padding:6px 10px;border-bottom:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dimmer);text-align:center;border-top:2px solid var(--gold-dim);border-bottom:1px dashed var(--line);background:rgba(111,168,245,0.05);}
  .wildcard-row{background:rgba(231,184,78,0.10);box-shadow:inset 3px 0 0 var(--gold);}
  .wildcard-row:hover{background:rgba(231,184,78,0.17);}
  .wildcard-tag{
    display:inline-flex;align-items:center;gap:3px;background:var(--gold);color:#1a1204;font-family:'IBM Plex Sans',sans-serif;
    font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:2px;margin-left:8px;vertical-align:middle;
    text-transform:uppercase;
  }
  .wildcard-tag-sm{font-size:9px;padding:1px 5px;margin-left:6px;}
  .team-cell{display:flex;align-items:center;gap:10px;}
  .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--field3);flex-shrink:0;border:1px solid var(--line-strong);}
  .avatar-fallback{
    width:44px;height:44px;border-radius:50%;background:var(--field3);border:1px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;color:var(--gold);font-size:15px;flex-shrink:0;
  }
  .team-name{font-weight:600;font-size:14px;}
  .owner-name{color:var(--chalk-dimmer);font-size:11.5px;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .num.dim{color:var(--chalk-dim);}
  .result-w{color:var(--gold);font-weight:700;}
  .result-l{color:var(--crimson);font-weight:700;}
  .badge-max{color:var(--gold);}
  th.num{text-align:right;}
  .foot-note{color:var(--chalk-dimmer);font-size:11.5px;margin-top:14px;line-height:1.6;}

  /* ---------- team detail ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--chalk-dim);font-size:13px;font-weight:600;margin-bottom:20px;}
  .back-link:hover{color:var(--gold);}
  .team-header{display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line-strong);padding-bottom:22px;margin-bottom:26px;flex-wrap:wrap;}
  .avatar-lg{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid var(--gold-dim);flex-shrink:0;background:var(--field3);}
  .avatar-lg-fallback{width:132px;height:132px;border-radius:50%;border:3px solid var(--gold-dim);background:var(--field3);display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;color:var(--gold);font-size:44px;flex-shrink:0;}
  .avatar-md{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--line-strong);flex-shrink:0;background:var(--field3);}
  .avatar-md-fallback{width:88px;height:88px;border-radius:50%;border:2px solid var(--line-strong);background:var(--field3);display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;color:var(--gold);font-size:28px;flex-shrink:0;}
  .team-header h2{font-size:clamp(24px,4vw,34px);}
  .team-header .owner-name{font-size:13px;margin-top:4px;}
  .stat-strip{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px;}
  .stat-strip .stat{font-size:13px;color:var(--chalk-dim);}
  .stat-strip .stat b{color:var(--chalk);font-family:'Anton',sans-serif;font-size:16px;font-weight:400;margin-right:4px;}
  .streak-badge{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:4px 10px;border:1px solid;letter-spacing:.03em;}
  .streak-badge.win{color:var(--gold);border-color:var(--gold-dim);}
  .streak-badge.loss{color:var(--crimson);border-color:var(--crimson);}

  .section-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dimmer);font-weight:600;margin:36px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px;}
  .section-title:first-of-type{margin-top:0;}

  .h2h-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);}
  .h2h-row{background:var(--field);display:flex;align-items:center;gap:12px;padding:11px 12px;}
  .h2h-row .avatar,.h2h-row .avatar-fallback{width:32px;height:32px;font-size:12px;}
  .h2h-name{flex:1;font-size:13.5px;font-weight:600;}
  .h2h-record{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.02em;}
  .h2h-record .w{color:var(--gold);}
  .h2h-record .l{color:var(--crimson);}
  .h2h-pts{color:var(--chalk-dimmer);font-size:11.5px;width:120px;text-align:right;}

  .roster-sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dim);margin:20px 0 10px;font-weight:600;}
  .roster-sub:first-child{margin-top:0;}
  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(96px,1fr));gap:12px;}
  .player-card{border:1px solid var(--line-strong);background:var(--field2);padding:10px 8px;text-align:center;}
  .player-img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--field3);margin:0 auto 8px;display:block;border:1px solid var(--line-strong);}
  .player-name{font-size:11.5px;font-weight:600;line-height:1.25;}
  .player-meta{font-size:10.5px;color:var(--chalk-dimmer);margin-top:2px;}

  /* ---------- records ---------- */
  .records-list{display:flex;flex-direction:column;margin-bottom:8px;}
  .record-row{display:flex;align-items:center;gap:22px;padding:22px 0;border-bottom:1px solid var(--line);}
  .record-row:first-child{padding-top:4px;}
  .record-row-clickable{cursor:pointer;}
  .record-row-clickable:hover{background:rgba(111,168,245,0.05);}
  .record-avatars{display:flex;flex-shrink:0;}
  .record-avatars .avatar-md,.record-avatars .avatar-md-fallback{margin-left:-18px;}
  .record-avatars .avatar-md:first-child,.record-avatars .avatar-md-fallback:first-child{margin-left:0;}
  .record-body{min-width:0;flex:1;}
  .record-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dim);font-weight:600;}
  .record-value{font-family:'Anton',sans-serif;font-size:40px;margin:4px 0 2px;line-height:1;}
  .record-name{font-size:15px;font-weight:600;color:var(--chalk);}
  .record-ctx{font-size:12px;color:var(--chalk-dimmer);margin-top:3px;}
  .record-expand-hint{flex-shrink:0;font-size:11px;color:var(--gold-dim);font-weight:700;white-space:nowrap;padding-left:12px;letter-spacing:.02em;}

  .record-sub-list{display:flex;flex-direction:column;margin:-6px 0 12px;padding-left:24px;border-left:2px solid var(--line-strong);}
  .record-sub-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px;cursor:pointer;}
  .record-sub-row:hover .record-sub-name{color:var(--chalk);}
  .record-sub-rank{color:var(--chalk-dimmer);font-family:'Anton',sans-serif;width:16px;flex-shrink:0;font-size:13px;}
  .record-sub-row .avatar,.record-sub-row .avatar-fallback{width:26px;height:26px;font-size:10px;}
  .record-sub-name{flex:1;min-width:0;font-weight:600;color:var(--chalk-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .record-sub-value{font-family:'Anton',sans-serif;color:var(--chalk);font-size:14px;flex-shrink:0;}
  .record-sub-ctx{color:var(--chalk-dimmer);font-size:10.5px;flex-shrink:0;max-width:220px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- transactions: card list ---------- */
  .txn-tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:5px 12px;text-transform:uppercase;flex-shrink:0;}
  .txn-tag-type{background:rgba(111,168,245,0.14);color:var(--gold);border:1px solid var(--gold-dim);}
  .txn-tag-bidders{background:rgba(231,184,78,0.14);color:var(--chalk);border:1px solid var(--line-strong);}
  .txn-card{border:1px solid var(--line-strong);background:var(--field2);margin-bottom:16px;cursor:pointer;}
  .txn-card:hover{border-color:var(--gold-dim);}
  .txn-card-top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .txn-card-date{font-size:13px;color:var(--chalk-dimmer);margin-left:auto;}
  .txn-card-body{display:flex;align-items:center;padding:20px;gap:18px;}
  .txn-side{flex:1;min-width:0;}
  .txn-side-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .txn-side-head .avatar,.txn-side-head .avatar-fallback{width:32px;height:32px;font-size:11px;flex-shrink:0;}
  .txn-side-team{font-size:15px;font-weight:600;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .txn-side-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0;}
  .txn-side-label.add{color:var(--gold);}
  .txn-side-label.drop{color:var(--crimson);}
  .txn-side-player{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
  .txn-side-player:last-child{margin-bottom:0;}
  .txn-side-img{width:56px;height:56px;margin:0;flex-shrink:0;}
  .txn-side-player-name{font-size:16px;font-weight:600;}
  .txn-side-player-meta{font-size:12.5px;color:var(--chalk-dimmer);margin-top:2px;}
  .txn-mid{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .txn-mid-amt{font-family:'Anton',sans-serif;font-size:30px;color:var(--chalk);}
  .txn-mid-label{font-size:10.5px;color:var(--chalk-dimmer);letter-spacing:.06em;}
  .txn-mid-icon{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:var(--gold-dim);font-size:10px;font-weight:700;margin-top:8px;}

  /* ---------- transactions: detail modal ---------- */
  .txn-modal-overlay{position:fixed;inset:0;background:rgba(4,4,5,0.78);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto;}
  .txn-modal{background:var(--field2);border:1px solid var(--line-strong);max-width:640px;width:100%;}
  .txn-modal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .txn-modal-week{font-size:12.5px;font-weight:700;color:var(--chalk-dim);letter-spacing:.03em;}
  .txn-modal-nav{display:flex;gap:6px;margin-left:auto;}
  .txn-modal-nav button,.txn-modal-close{width:30px;height:30px;border:1px solid var(--line-strong);background:transparent;color:var(--chalk-dim);cursor:pointer;font-size:15px;font-family:inherit;}
  .txn-modal-nav button:hover,.txn-modal-close:hover{color:var(--chalk);border-color:var(--gold-dim);}
  .txn-modal-nav button:disabled{opacity:0.25;cursor:not-allowed;}
  .txn-modal-nav button:disabled:hover{border-color:var(--line-strong);}
  .txn-modal-body{padding:20px;}
  .txn-modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .txn-modal-claimed{cursor:pointer;}
  .txn-modal-claimed-label{font-size:11px;color:var(--gold-dim);letter-spacing:.05em;text-transform:uppercase;font-weight:600;}
  .txn-modal-team{display:flex;align-items:center;gap:12px;margin-top:8px;}
  .txn-modal-team-name{font-family:'Anton',sans-serif;font-size:22px;line-height:1;}
  .txn-modal-owner{font-size:12px;color:var(--chalk-dimmer);margin-top:2px;}
  .txn-modal-bid-block{text-align:right;}
  .txn-modal-bid-label{font-size:11px;color:var(--chalk-dimmer);letter-spacing:.04em;text-transform:uppercase;}
  .txn-modal-bid-amt{font-family:'Anton',sans-serif;font-size:34px;color:var(--gold);line-height:1;margin-top:4px;}
  .txn-modal-players{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .txn-modal-player-col{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px;}
  .txn-modal-player-card{display:flex;align-items:center;gap:12px;border-left:3px solid;padding:10px 14px;background:var(--field3);}
  .txn-modal-player-card.add{border-color:var(--gold);}
  .txn-modal-player-card.drop{border-color:var(--crimson);}
  .txn-modal-player-img{width:60px;height:60px;margin:0;flex-shrink:0;}
  .txn-modal-player-name{font-size:15px;font-weight:600;}
  .txn-modal-player-meta{font-size:12px;color:var(--chalk-dimmer);margin-top:2px;}
  .txn-modal-bids-title{font-size:11px;color:var(--gold-dim);letter-spacing:.05em;text-transform:uppercase;font-weight:600;margin-bottom:10px;}
  .txn-modal-bid-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line-strong);margin-bottom:6px;cursor:pointer;}
  .txn-modal-bid-row:hover{border-color:var(--gold-dim);}
  .txn-modal-bid-row.won{border-color:var(--gold);background:rgba(231,184,78,0.08);}
  .txn-modal-bid-row-amt{font-family:'Anton',sans-serif;font-size:16px;color:var(--chalk);width:48px;flex-shrink:0;}
  .txn-modal-bid-row-name{flex:1;font-size:13px;font-weight:600;min-width:0;}
  .txn-modal-bid-tag{font-size:9.5px;font-weight:700;padding:3px 9px;letter-spacing:.04em;flex-shrink:0;}
  .txn-modal-bid-tag.won{background:var(--gold);color:#1a1204;}
  .txn-modal-bid-tag.outbid{border:1px solid var(--line-strong);color:var(--chalk-dimmer);}

  /* ---------- league awards ---------- */
  .award-season{margin-bottom:24px;}
  .award-season-year{font-family:'Anton',sans-serif;color:var(--gold);font-size:19px;margin-bottom:10px;}
  .award-podium{display:flex;gap:12px;flex-wrap:wrap;}
  .award-card{border:1px solid var(--line-strong);background:var(--field2);padding:16px;min-width:170px;flex:1 1 170px;cursor:pointer;text-align:center;}
  .award-card:hover{border-color:var(--gold-dim);}
  .award-emoji{font-size:24px;}
  .award-card .avatar,.award-card .avatar-fallback{display:block;margin:8px auto 6px;}
  .award-name{font-size:14px;font-weight:600;}
  .award-label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--chalk-dimmer);margin-top:3px;}
  .award-players{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);text-align:left;}
  .award-player-row{font-size:11px;color:var(--chalk-dim);padding:2px 0;}

  .champs-list{display:flex;flex-direction:column;gap:1px;background:var(--line);margin-top:6px;}
  .champs-row{background:var(--field);display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13.5px;}
  .champs-row .avatar,.champs-row .avatar-fallback{width:26px;height:26px;font-size:11px;}
  .champs-row b{font-family:'Anton',sans-serif;color:var(--gold);font-weight:400;margin-left:auto;}

  /* ---------- analytics ---------- */
  .analytics-section{margin-bottom:52px;}
  .analytics-section:last-child{margin-bottom:0;}

<script>
(function(){

/* ============================= CONFIG ============================= */
var LEAGUE_ID = "1387553090483273728";
var API = "https://api.sleeper.app/v1";

/* ============================= UTIL ============================= */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs){
    if (attrs[k] == null) continue;
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children = children || [];
  children.forEach(function(c){
    if (c == null) return;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });

}
function fmt1(n){ return (Math.round((n||0)*10)/10).toFixed(1); }
function fmt0(n){ return Math.round(n||0).toString(); }
function initials(name){
  if (!name) return "?";
  var parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}
async function fetchJSON(url){
  try{
    var res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

/* Prefer the per-league custom team logo (metadata.avatar) over the personal
   Sleeper account picture (avatar). Sleeper stores a custom team logo, when a
   manager has set one, as a full URL or id in user.metadata.avatar. */
function resolveAvatarSrc(user){
  if (!user) return null;
  if (user.metadata && user.metadata.avatar){
    var a = user.metadata.avatar;
    return /^https?:\/\//.test(a) ? a : (CDN + "/avatars/" + a);
  }
  if (user.avatar) return CDN + "/avatars/" + user.avatar;
  return null;
}

/* avatar element for a user object */
function avatarEl(user, size){
  size = size || "sm";
  var cls = size === "lg" ? "avatar-lg" : (size === "md" ? "avatar-md" : "avatar");
  var fcls = size === "lg" ? "avatar-lg-fallback" : (size === "md" ? "avatar-md-fallback" : "avatar-fallback");
  var src = resolveAvatarSrc(user);
  if (src){
    var img = el("img", {class:cls, src: src, alt:""});
    img.onerror = function(){
      var fb = el("div", {class:fcls}, [initials(teamName(user))]);
      img.replaceWith(fb);
    };
    return img;
  }
  return el("div", {class:fcls}, [initials(user ? teamName(user) : "?")]);
}

function teamName(user){
  if (!user) return "Unknown Team";
  if (user.metadata && user.metadata.team_name) return user.metadata.team_name;
  return user.display_name || "Team";
}

function playerImgEl(playerId, playersInfo){
  var isDef = /^[A-Z]{2,4}$/.test(playerId) && !playersInfo[playerId];
  var img;
  if (isDef){
    img = el("img", {class:"player-img", src: CDN + "/images/team_logos/nfl/" + playerId.toLowerCase() + ".png", alt:""});
    img.style.objectFit = "contain";
    img.style.background = "#fff";
  } else {
    img = el("img", {class:"player-img", src: CDN + "/content/nfl/players/" + playerId + ".jpg", alt:""});
  }
  img.onerror = function(){
    img.onerror = null;
    img.src = CDN + "/images/v2/icons/player_default.webp";
  };
  return img;
}

var POSITION_COLS = ["QB","RB","WR","TE","FLEX","K","DEF"];

/* Break a single matchup entry's starters down into points scored per
   position group (FLEX-type slots are merged into one "FLEX" bucket). */
function computePositionBreakdown(entry, rosterPositions){
  var out = {QB:0,RB:0,WR:0,TE:0,FLEX:0,K:0,DEF:0};
  if (!entry || !rosterPositions) return out;
  var slots = rosterPositions.filter(function(p){ return p !== "BN" && p !== "IR" && p !== "TAXI"; });
  var starters = entry.starters || [];
  for (var i=0;i<starters.length;i++){
    var slot = slots[i];
    if (!slot) continue;
    var cat = FLEX_MAP[slot] ? "FLEX" : slot;
    if (!(cat in out)) continue;
    var pid = starters[i];
    var pts = null;
    if (entry.players_points && entry.players_points[pid] != null) pts = entry.players_points[pid];
    else if (entry.starters_points && entry.starters_points[i] != null) pts = entry.starters_points[i];
    out[cat] += pts || 0;
  }
  return out;
}

/* Sum points scored by each player while they were in that roster's starting
   lineup, across every scored week of the season (regular + postseason).
   Used to surface a champion's top contributors. */
function computeTopStartedPlayers(season, rosterId, limit){
  limit = limit || 3;
  if (rosterId == null) return [];
  var totals = {};
  Object.keys(season.matchupsByWeek).forEach(function(wk){
    var entry = season.matchupsByWeek[wk].find(function(e){ return e.roster_id === rosterId; });
    if (!entry || !entry.starters) return;
    entry.starters.forEach(function(pid, i){
      if (!pid) return;
      var pts = null;
      if (entry.players_points && entry.players_points[pid] != null) pts = entry.players_points[pid];
      else if (entry.starters_points && entry.starters_points[i] != null) pts = entry.starters_points[i];
      if (pts == null) return;
      totals[pid] = (totals[pid] || 0) + pts;
    });
  });
  return Object.keys(totals).map(function(pid){ return {id:pid, pts:totals[pid]}; })
    .sort(function(a,b){ return b.pts - a.pts; })
    .slice(0, limit);
}

function gaussianKDE(values, xs, bw){
  return xs.map(function(x){
    var s = 0;
    for (var i=0;i<values.length;i++){ var u = (x-values[i])/bw; s += Math.exp(-0.5*u*u); }
    return s / (values.length*bw*Math.sqrt(2*Math.PI));
  });
}
function silvermanBW(values){
  var n = values.length;
  if (n < 2) return 5;
  var mean = values.reduce(function(a,b){ return a+b; },0)/n;
  var variance = values.reduce(function(a,b){ return a+(b-mean)*(b-mean); },0)/(n-1);
  var sd = Math.sqrt(variance) || 1;
  return Math.max(1.06*sd*Math.pow(n,-0.2), 1.5);
}
function linspace(a,b,n){
  var out=[]; for (var i=0;i<n;i++) out.push(a+(b-a)*i/(n-1)); return out;
}
/* Colorblind-friendly diverging scale: saturated red (low) through neutral
   panel grey (mid) to saturated blue (high). Red/blue stays distinguishable
   across protanopia, deuteranopia and tritanopia, and brightness increases
   toward the "good" end so the cue doesn't rely on hue alone. */
function heatColor(t){
  t = Math.max(0, Math.min(1, t));
  var stops = t < 0.5
    ? [[152,42,48], [40,42,48], t/0.5]
    : [[40,42,48], [46,128,218], (t-0.5)/0.5];
  var c1=stops[0], c2=stops[1], f=stops[2];
  var r = Math.round(c1[0]+(c2[0]-c1[0])*f);
  var g = Math.round(c1[1]+(c2[1]-c1[1])*f);
  var b = Math.round(c1[2]+(c2[2]-c1[2])*f);
  return "rgb("+r+","+g+","+b+")";
}

var STATE = {
  seasons: [],          // chronological (oldest -> newest), each: {league, rosters, users, rosterOwner, matchupsByWeek, bracketChampionUser}
  users: {},            // user_id -> merged user object (latest wins), plus .active
  playersInfo: {},      // trimmed player map, player_id -> {n,pos,team,fp}
  currentSeason: null,
  career: {},           // user_id -> aggregate stats
  h2h: {},              // user_id -> { opponentUserId -> {w,l,t,pf,pa} }
  seasonAllPlay: {},    // league_id -> user_id -> {w,l,t}
  seasonAwards: [],     // one entry per season: {season, seasonObj, champUid, champRosterId, runnerUid, thirdUid, toiletUid}
  transactionsBySeasonId: {}, // league_id -> raw transaction array (lazy-loaded)
  records: null,
  ready: false
};

var FLEX_MAP = {
  FLEX: ["RB","WR","TE"],
  SUPER_FLEX: ["QB","RB","WR","TE"],
  WRRB_FLEX: ["RB","WR"],
  REC_FLEX: ["WR","TE"],
  WR_TE_FLEX: ["WR","TE"],

function setLoadingMsg(t){ var m = $("#loadingMsg"); if (m) m.textContent = t; }

async function loadPlayersInfo(){
  var today = new Date().toISOString().slice(0,10);
  try{
    var cachedDate = localStorage.getItem("sleeper_players_date");
    if (cachedDate === today){
      var cached = localStorage.getItem("sleeper_players_trim");
      if (cached) return JSON.parse(cached);
    }
  }catch(e){}
  setLoadingMsg("Downloading the NFL player book (this happens once a day)…");
  var raw = await fetchJSON(API + "/players/nfl");
  var trim = {};
  if (raw){
    for (var id in raw){
      var p = raw[id];
      if (!p) continue;
      var name = ((p.first_name||"") + " " + (p.last_name||"")).trim();
      if (!name) continue;
      trim[id] = {
        n: name,
        pos: p.position || (p.fantasy_positions && p.fantasy_positions[0]) || "",
        team: p.team || "FA",
        fp: p.fantasy_positions || (p.position ? [p.position] : [])
      };
    }
  }
  try{
    localStorage.setItem("sleeper_players_trim", JSON.stringify(trim));
    localStorage.setItem("sleeper_players_date", today);
  }catch(e){ /* quota exceeded, ignore caching */ }
  return trim;
}

async function loadLeagueChain(startId){
  var chain = [];
  var id = startId;
  var guard = 0;
  while (id && guard < 25){
    setLoadingMsg("Finding league history… (" + (chain.length+1) + " season" + (chain.length===0?"":"s") + " found)");
    var lg = await fetchJSON(API + "/league/" + id);
    if (!lg || !lg.league_id) break;
    chain.push(lg);
    id = lg.previous_league_id;
    guard++;
  }
  chain.reverse();
  return chain;
}

async function loadSeason(league, isLatest, nflState){
  var rosters = await fetchJSON(API + "/league/" + league.league_id + "/rosters");
  var users = await fetchJSON(API + "/league/" + league.league_id + "/users");
  rosters = rosters || [];
  users = users || [];

  var rosterOwner = {};
  rosters.forEach(function(r){ rosterOwner[r.roster_id] = r.owner_id; });

  var maxWeek = 17;
  if (isLatest && nflState && nflState.season === league.season){
    maxWeek = Math.max(1, nflState.week || 1);
  } else if (league.settings && league.settings.playoff_week_start){
    maxWeek = Math.min(18, league.settings.playoff_week_start + 2);
  }

  var matchupsByWeek = {};
  var weekJobs = [];
  for (var w=1; w<=maxWeek; w++){
    (function(w){
      weekJobs.push(fetchJSON(API + "/league/" + league.league_id + "/matchups/" + w).then(function(data){
        return {w:w, data:data};
      }));
    })(w);
  }
  var weekResults = await Promise.all(weekJobs);
  weekResults.forEach(function(r){
    if (Array.isArray(r.data) && r.data.length){
      var played = r.data.some(function(e){ return (e.custom_points!=null ? e.custom_points : e.points||0) > 0; });
      if (played) matchupsByWeek[r.w] = r.data;
    }
  });

  var bracketChampionRoster = null, bracketRunnerUpRoster = null, bracketThirdRoster = null;
  var bracket = await fetchJSON(API + "/league/" + league.league_id + "/winners_bracket");
  if (Array.isArray(bracket)){
    var finals = bracket.find(function(m){ return m.p === 1 && m.w != null; });
    if (finals){ bracketChampionRoster = finals.w; bracketRunnerUpRoster = finals.l; }
    var thirdGame = bracket.find(function(m){ return m.p === 3 && m.w != null; });
    if (thirdGame) bracketThirdRoster = thirdGame.w;
  }

  // Toilet bowl: only the finalist who escaped last place (the "2nd worst") is tracked,
  // not the team that actually finished last.
  var toiletBowlFinalistRoster = null;
  var losersBracket = await fetchJSON(API + "/league/" + league.league_id + "/losers_bracket");
  if (Array.isArray(losersBracket)){
    var lastPlaceGame = losersBracket.find(function(m){ return m.p === 1 && m.w != null; });
    if (lastPlaceGame) toiletBowlFinalistRoster = lastPlaceGame.w;
  }

  return {league: league, rosters: rosters, users: users, rosterOwner: rosterOwner, matchupsByWeek: matchupsByWeek,
    bracketChampionRoster: bracketChampionRoster, bracketRunnerUpRoster: bracketRunnerUpRoster, bracketThirdRoster: bracketThirdRoster,
    toiletBowlFinalistRoster: toiletBowlFinalistRoster};
}

function eligiblePositions(playerId){
  var info = STATE.playersInfo[playerId];
  if (info) return info.fp && info.fp.length ? info.fp : [info.pos];
  if (/^[A-Z]{2,4}$/.test(playerId)) return ["DEF"];
  return [];
}

function computeOptimal(entry, rosterPositions){
  if (!entry.players_points || !entry.players || !rosterPositions) return null;
  var slots = rosterPositions.filter(function(p){ return p !== "BN" && p !== "IR" && p !== "TAXI"; });
  var pool = entry.players
    .filter(function(id){ return entry.players_points[id] != null; })
    .map(function(id){ return {id:id, pts: entry.players_points[id] || 0, pos: eligiblePositions(id)}; });
  var used = {};
  var total = 0;
  function assign(eligible){
    var best = null;
    for (var i=0;i<pool.length;i++){
      var p = pool[i];
      if (used[p.id]) continue;
      if (p.pos.some(function(x){ return eligible.indexOf(x) !== -1; })){
        if (!best || p.pts > best.pts) best = p;
      }
    }
    if (best){ used[best.id] = true; total += best.pts; }
  }
  var exact = slots.filter(function(s){ return !FLEX_MAP[s]; });
  var flex = slots.filter(function(s){ return FLEX_MAP[s]; });
  exact.forEach(function(s){ assign([s]); });
  flex.forEach(function(s){ assign(FLEX_MAP[s]); });
  return total;
}

/* ============================= AGGREGATE ============================= */
function buildAggregates(){
  var users = {};
  STATE.seasons.forEach(function(season){
    season.users.forEach(function(u){ users[u.user_id] = u; });
  });
  var latest = STATE.seasons[STATE.seasons.length - 1];
  latest.users.forEach(function(u){ users[u.user_id].active = true; });
  STATE.users = users;
  STATE.currentSeason = latest;

  var career = {};
  var h2h = {};
  function ensureCareer(uid){
    if (!career[uid]) career[uid] = {
      wins:0, losses:0, ties:0, pf:0, pa:0, gp:0,
      results:[], // chronological {season,week,pf,pa,res,opp}
      optimalPF:0, optimalGames:0, benchWasteTotal:0, benchWasteBest:null,
      championships:0, championSeasons:[],
      runnerUps:0, runnerUpSeasons:[],
      thirdPlaces:0, thirdPlaceSeasons:[],
      toiletBowlFinalist:0, toiletBowlSeasons:[],
      allPlayWins:0, allPlayLosses:0, allPlayTies:0
    };
    return career[uid];
  }
  function ensureH2H(uid, oid){
    if (!h2h[uid]) h2h[uid] = {};
    if (!h2h[uid][oid]) h2h[uid][oid] = {w:0,l:0,t:0,pf:0,pa:0};
    return h2h[uid][oid];
  }

  var records = {
    highGame:null, lowGame:null, highCombined:null, blowout:null, nailbiter:null,
    bestSeason:null, benchWaste:null
  };

  STATE.seasonAwards = [];

  STATE.seasons.forEach(function(season){
    var seasonSum = {}; // uid -> {pf,pa}
    var seasonAllPlay = {}; // uid -> {w,l,t}
    var rosterPositions = season.league.roster_positions;

    var champUid = season.bracketChampionRoster != null ? season.rosterOwner[season.bracketChampionRoster] : null;
    var runnerUid = season.bracketRunnerUpRoster != null ? season.rosterOwner[season.bracketRunnerUpRoster] : null;
    var thirdUid = season.bracketThirdRoster != null ? season.rosterOwner[season.bracketThirdRoster] : null;
    var toiletUid = season.toiletBowlFinalistRoster != null ? season.rosterOwner[season.toiletBowlFinalistRoster] : null;

    if (champUid){ var cc = ensureCareer(champUid); cc.championships++; cc.championSeasons.push(season.league.season); }
    if (runnerUid){ var rc = ensureCareer(runnerUid); rc.runnerUps++; rc.runnerUpSeasons.push(season.league.season); }
    if (thirdUid){ var tc = ensureCareer(thirdUid); tc.thirdPlaces++; tc.thirdPlaceSeasons.push(season.league.season); }
    if (toiletUid){ var xc = ensureCareer(toiletUid); xc.toiletBowlFinalist++; xc.toiletBowlSeasons.push(season.league.season); }

    if (champUid || runnerUid || thirdUid || toiletUid){
      STATE.seasonAwards.push({
        season: season.league.season, seasonObj: season,
        champUid: champUid, champRosterId: season.bracketChampionRoster,
        runnerUid: runnerUid, thirdUid: thirdUid, toiletUid: toiletUid
      });
    }

    Object.keys(season.matchupsByWeek).forEach(function(wk){
      var week = parseInt(wk,10);
      var entries = season.matchupsByWeek[wk].filter(function(e){ return season.rosterOwner[e.roster_id]; });

      // all-play: compare every team's score against every other team that played this week
      var weekScores = entries.map(function(e){
        return {uid: season.rosterOwner[e.roster_id], pts: e.custom_points != null ? e.custom_points : (e.points||0)};
      }).filter(function(x){ return x.pts > 0; });
      if (weekScores.length > 1){
        weekScores.forEach(function(me){
          var w=0,l=0,t=0;
          weekScores.forEach(function(other){
            if (other === me) return;
            if (me.pts > other.pts) w++; else if (me.pts < other.pts) l++; else t++;
          });
          var ap = seasonAllPlay[me.uid] = seasonAllPlay[me.uid] || {w:0,l:0,t:0};
          ap.w += w; ap.l += l; ap.t += t;
          var cAp = ensureCareer(me.uid);
          cAp.allPlayWins += w; cAp.allPlayLosses += l; cAp.allPlayTies += t;
        });
      }

      var byMatchup = {};
      entries.forEach(function(e){
        var mid = e.matchup_id;
        if (mid == null) return;
        (byMatchup[mid] = byMatchup[mid] || []).push(e);
      });
      Object.keys(byMatchup).forEach(function(mid){
        var pair = byMatchup[mid];
        if (pair.length !== 2) return;
        var A = pair[0], B = pair[1];
        var uidA = season.rosterOwner[A.roster_id];
        var uidB = season.rosterOwner[B.roster_id];
        var ptsA = A.custom_points != null ? A.custom_points : (A.points||0);
        var ptsB = B.custom_points != null ? B.custom_points : (B.points||0);
        if (ptsA === 0 && ptsB === 0) return;

        var optA = computeOptimal(A, rosterPositions);
        var optB = computeOptimal(B, rosterPositions);

        [ [uidA, uidB, ptsA, ptsB, optA, optB],[uidB, uidA, ptsB, ptsA, optB, optA] ].forEach(function(t){
          var uid=t[0], opp=t[1], pf=t[2], pa=t[3], opt=t[4], oppOpt=t[5];
          var c = ensureCareer(uid);
          c.gp++; c.pf += pf; c.pa += pa;
          var res = pf > pa ? "W" : (pf < pa ? "L" : "T");
          if (res==="W") c.wins++; else if (res==="L") c.losses++; else c.ties++;
          c.results.push({season:season.league.season, week:week, pf:pf, pa:pa, res:res, opp:opp, opt:opt, oppOpt:oppOpt});
          if (opt != null){
            c.optimalPF += opt; c.optimalGames++;
            var waste = opt - pf;
            if (waste > 0.01){
              c.benchWasteTotal += waste;
              if (!records.benchWaste || waste > records.benchWaste.value){
                records.benchWaste = {value:waste, uid:uid, season:season.league.season, week:week, pf:pf, opt:opt};
              }
            }
          }
          seasonSum[uid] = seasonSum[uid] || {pf:0,pa:0};
          seasonSum[uid].pf += pf; seasonSum[uid].pa += pa;

          var hh = ensureH2H(uid, opp);
          if (res==="W") hh.w++; else if (res==="L") hh.l++; else hh.t++;
          hh.pf += pf; hh.pa += pa;
        });

        if (!records.highGame || ptsA > records.highGame.value) records.highGame = {value:ptsA, uid:uidA, opp:uidB, season:season.league.season, week:week};
        if (!records.highGame || ptsB > records.highGame.value) records.highGame = {value:ptsB, uid:uidB, opp:uidA, season:season.league.season, week:week};
        if (ptsA > 0 && (!records.lowGame || ptsA < records.lowGame.value)) records.lowGame = {value:ptsA, uid:uidA, opp:uidB, season:season.league.season, week:week};
        if (ptsB > 0 && (!records.lowGame || ptsB < records.lowGame.value)) records.lowGame = {value:ptsB, uid:uidB, opp:uidA, season:season.league.season, week:week};

        var combined = ptsA + ptsB;
        if (!records.highCombined || combined > records.highCombined.value) records.highCombined = {value:combined, uidA:uidA, uidB:uidB, season:season.league.season, week:week};

        var margin = Math.abs(ptsA - ptsB);
        var winU = ptsA>ptsB?uidA:uidB, loseU = ptsA>ptsB?uidB:uidA;
        var winPts = Math.max(ptsA,ptsB), losePts = Math.min(ptsA,ptsB);
        if (ptsA !== ptsB){
          if (!records.blowout || margin > records.blowout.value) records.blowout = {value:margin, winner:winU, loser:loseU, season:season.league.season, week:week, winPts:winPts, losePts:losePts};
          if (!records.nailbiter || margin < records.nailbiter.value) records.nailbiter = {value:margin, winner:winU, loser:loseU, season:season.league.season, week:week, winPts:winPts, losePts:losePts};
        }
      });
    });

    Object.keys(seasonSum).forEach(function(uid){
      var s = seasonSum[uid];
      if (!records.bestSeason || s.pf > records.bestSeason.value){
        records.bestSeason = {value:s.pf, uid:uid, season:season.league.season};
      }
    });

    STATE.seasonAllPlay[season.league.league_id] = seasonAllPlay;
  });

  // streaks
  var mostWinStreak=null, mostLossStreak=null;
  Object.keys(career).forEach(function(uid){
    var c = career[uid];
    var cur = 0, curType = null, bestW = 0, bestWctx=null, bestL=0, bestLctx=null, runStart=null;
    c.results.forEach(function(r, i){
      if (r.res === curType){ cur++; } else { cur = 1; curType = r.res; runStart = r; }
      if (curType === "W" && cur > bestW){ bestW = cur; bestWctx = {len:cur, endSeason:r.season, endWeek:r.week}; }
      if (curType === "L" && cur > bestL){ bestL = cur; bestLctx = {len:cur, endSeason:r.season, endWeek:r.week}; }
    });
    c._bestWinStreak = bestW; c._bestWinCtx = bestWctx;
    c._bestLossStreak = bestL; c._bestLossCtx = bestLctx;
    // current streak (from end)
    var lastRes = c.results.length ? c.results[c.results.length-1].res : null;
    var n = 0;
    for (var i=c.results.length-1; i>=0; i--){
      if (c.results[i].res === lastRes) n++; else break;
    }
    c.currentStreak = lastRes ? {type:lastRes, len:n} : null;

    if (bestW && (!mostWinStreak || bestW > mostWinStreak.value)) mostWinStreak = {value:bestW, uid:uid, ctx:bestWctx};
    if (bestL && (!mostLossStreak || bestL > mostLossStreak.value)) mostLossStreak = {value:bestL, uid:uid, ctx:bestLctx};
  });
  records.winStreak = mostWinStreak;
  records.lossStreak = mostLossStreak;

  // most wins / losses career
  var mostWins=null, mostLosses=null, mostEfficient=null;
  Object.keys(career).forEach(function(uid){
    var c = career[uid];
    if (!mostWins || c.wins > mostWins.value) mostWins = {value:c.wins, uid:uid};
    if (!mostLosses || c.losses > mostLosses.value) mostLosses = {value:c.losses, uid:uid};
    if (c.optimalGames >= 10){
      var eff = c.pf / c.optimalPF;
      if (!mostEfficient || eff > mostEfficient.value) mostEfficient = {value:eff, uid:uid};
    }
  });
  records.mostWins = mostWins;
  records.mostLosses = mostLosses;
  records.mostEfficient = mostEfficient;

  // luck: actual win% vs all-play win%
  var luckiest=null, unluckiest=null;
  Object.keys(career).forEach(function(uid){
    var c = career[uid];
    var apTotal = c.allPlayWins + c.allPlayLosses + c.allPlayTies;
    if (apTotal >= 10 && c.gp >= 5){
      var actualPct = (c.wins + 0.5*c.ties) / c.gp;
      var apPct = (c.allPlayWins + 0.5*c.allPlayTies) / apTotal;
      var delta = actualPct - apPct;
      if (!luckiest || delta > luckiest.value) luckiest = {value:delta, uid:uid, actualPct:actualPct, apPct:apPct};
      if (!unluckiest || delta < unluckiest.value) unluckiest = {value:delta, uid:uid, actualPct:actualPct, apPct:apPct};
    }
  });
  records.luckiest = luckiest;
  records.unluckiest = unluckiest;

  STATE.career = career;
  STATE.h2h = h2h;
  STATE.records = records;
}

function buildSeasonStandingsRows(season){
  season = season || STATE.currentSeason;

  var rows = season.rosters.map(function(r){
    var uid = r.roster_id != null ? season.rosterOwner[r.roster_id] : null;
    var u = STATE.users[uid];
    var s = r.settings || {};
    var pf = (s.fpts||0) + (s.fpts_decimal||0)/100;
    var pa = (s.fpts_against||0) + (s.fpts_against_decimal||0)/100;
    var maxPf = null;
    var c = STATE.career[uid];
    if (c){
      var sum = 0, has = false;
      c.results.forEach(function(x){
        if (x.season === seasonYear && x.opt != null){ sum += x.opt; has = true; }
      });
      if (has) maxPf = sum;
    }
    var ap = apMap[uid];
    return {uid:uid, u:u, wins:s.wins||0, losses:s.losses||0, ties:s.ties||0, pf:pf, pa:pa, maxPf:maxPf, ap:ap};
  });
  sortRowsByRecord(rows);
  return rows;
}

function buildAllTimeStandingsRows(){
  var rows = Object.keys(STATE.career).map(function(uid){
    var c = STATE.career[uid];
    return {uid:uid, u:STATE.users[uid], wins:c.wins, losses:c.losses, ties:c.ties, pf:c.pf, pa:c.pa, maxPf: c.optimalGames ? c.optimalPF : null,
      ap:{w:c.allPlayWins, l:c.allPlayLosses, t:c.allPlayTies}};
  });
  sortRowsByRecord(rows);
  return rows;
}

function sortRowsByRecord(rows){
  rows.sort(function(a,b){
    if (b.wins !== a.wins) return b.wins - a.wins;
    return b.pf - a.pf;
  });
}

function renderStandings(){
  var app = $("#app");
  app.innerHTML = "";

  if (standingsSeasonIdx == null) standingsSeasonIdx = STATE.seasons.length - 1;
  var selectedSeason = STATE.seasons[standingsSeasonIdx];
  var isLatestSeason = selectedSeason === STATE.currentSeason;

  var headControls = [
    el("div", {class:"toggle-group"}, [
      el("button", {class: standingsMode==="season" ? "active" : "", onclick:function(){ standingsMode="season"; renderStandings(); }}, ["By Season"]),
      el("button", {class: standingsMode==="alltime" ? "active" : "", onclick:function(){ standingsMode="alltime"; renderStandings(); }}, ["All-Time"])
    ])
  ];
  if (standingsMode === "season" && STATE.seasons.length > 1) headControls.push(buildSeasonPickerSelect());

  var head = el("div", {class:"panel-head"}, [
    el("h2", {style:"font-size:20px;"}, ["Standings"]),
    el("div", {class:"panel-head-controls"}, headControls)
  ]);
  app.appendChild(head);

  // rows in true-standings order (this defines each team's official rank, regardless of column sort)
  var baseRows = standingsMode === "season" ? buildSeasonStandingsRows(selectedSeason) : buildAllTimeStandingsRows();
  baseRows.forEach(function(r,i){ r.defaultRank = i+1; });

  // star: the top scorer sitting outside the top 5 (season view only)
  var starUid = null;
  if (standingsMode === "season" && baseRows.length > 5){
    var rest = baseRows.slice(5);
    var starRow = rest.reduce(function(best,r){ return (!best || r.pf > best.pf) ? r : best; }, null);
    starUid = starRow ? starRow.uid : null;
  }

  var isDefaultSort = standingsSortKey === "wins" && standingsSortDir === "desc";
  var rows = baseRows.slice();
  if (!isDefaultSort){
    var valueFn = STANDINGS_SORT_VALUE[standingsSortKey];
    rows.sort(function(a,b){
      var va = valueFn(a), vb = valueFn(b);
      var cmp = va < vb ? -1 : (va > vb ? 1 : 0);
      return standingsSortDir === "asc" ? cmp : -cmp;
    });
  }

  function sortArrow(key){
    if (key !== standingsSortKey) return "";
    return standingsSortDir === "asc" ? " ▲" : " ▼";
  }
  function headerClick(key){
    return function(){
      if (standingsSortKey === key) standingsSortDir = standingsSortDir === "asc" ? "desc" : "asc";
      else { standingsSortKey = key; standingsSortDir = key === "team" ? "asc" : "desc"; }
      renderStandings();
    };
  }

  var table = el("table", {class:"standings"});
  var headCells = [el("th", {}, ["Rank"])];
  STANDINGS_COLS.forEach(function(col){
    headCells.push(el("th", {
      class: (col.key==="team" ? "sortable" : "num sortable") + (col.key===standingsSortKey ? " sort-active" : ""),
      title: col.title, onclick: headerClick(col.key)
    }, [col.label + sortArrow(col.key)]));
  });
  table.appendChild(el("thead", {}, [el("tr", {}, headCells)]));
  var tbody = el("tbody");
  var showLines = standingsMode === "season" && baseRows.length > 5 && isDefaultSort;
  rows.forEach(function(r, i){
    if (showLines && r.defaultRank === 6){
      tbody.appendChild(el("tr", {class:"standings-divider"}, [el("td", {colspan:"8"}, ["Playoff line"])]));
    }
    if (showLines && baseRows.length > 10 && r.defaultRank === baseRows.length - 4){
      tbody.appendChild(el("tr", {class:"standings-divider"}, [el("td", {colspan:"8"}, ["Bottom 5"])]));
    }
    var isStar = r.uid === starUid;
    var tr = el("tr", {"data-rank": r.defaultRank, class: isStar ? "wildcard-row" : "", onclick:function(){ if (r.uid) location.hash = "#team/" + r.uid; }});
    tr.appendChild(el("td", {}, [(function(){
      var glyph = rankGlyph(r.defaultRank, baseRows.length);
      var isGlyph = glyph !== String(r.defaultRank);
      return el("span", {class:"rank-chip" + (isGlyph ? " rank-glyph" : "")}, [glyph]);
    })()]));
    var nameWrap = el("div", {}, [
      el("div", {class:"team-name"}, [teamName(r.u), isStar ? el("span",{class:"wildcard-tag", title:"Highest points scorer outside the top 5 — the wild-card"},["★ Wild Card"]) : null]),
      el("div", {class:"owner-name"}, [r.u ? (r.u.display_name||"") : "Vacant"])
    ]);
    var teamCell = el("div", {class:"team-cell"}, [avatarEl(r.u, "sm"), nameWrap]);
    tr.appendChild(el("td", {}, [teamCell]));
    tr.appendChild(el("td", {class:"num"}, [r.wins + "-" + r.losses + (r.ties ? "-"+r.ties : "")]));
    tr.appendChild(el("td", {class:"num dim"}, [(function(){ var gp=r.wins+r.losses+r.ties; return gp ? fmt1((r.wins+r.ties*0.5)/gp*100) + "%" : "—"; })()]));
    tr.appendChild(el("td", {class:"num dim"}, [r.ap ? (r.ap.w + "-" + r.ap.l + (r.ap.t ? "-"+r.ap.t : "")) : "—"]));
    tr.appendChild(el("td", {class:"num"}, [fmt1(r.pf)]));
    tr.appendChild(el("td", {class:"num dim"}, [fmt1(r.pa)]));
    tr.appendChild(el("td", {class:"num badge-max"}, [r.maxPf != null ? fmt1(r.maxPf) : "—"]));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  app.appendChild(el("div", {class:"standings-table-wrap"}, [table]));

  app.appendChild(el("div", {class:"foot-note"}, [
    standingsMode === "season"
      ? "Showing " + selectedSeason.league.season + " regular-season totals. All-Play shows each team's record if it had played every other team every week. The ★ marks the highest scorer outside the top 5 — this league's wild-card. Click a column header to sort; click any team for head-to-head records and roster."
      : "All-time totals across every season found in this league's history. Click a column header to sort; click any team for details."
  ]));

  if (standingsMode === "season"){
    app.appendChild(buildPlayoffBracket(selectedSeason, isLatestSeason));
  } else {
    app.appendChild(buildPlayoffBracket(STATE.currentSeason, true));
  }
}

function buildPlayoffBracket(season, isLatest){
  var wrap = el("div", {});
  wrap.appendChild(el("div", {class:"section-title"}, ["Playoff Picture" + (isLatest ? "" : " — " + season.league.season)]));
  var rows = buildSeasonStandingsRows(season);
  if (rows.length < 6){
    wrap.appendChild(el("div", {class:"foot-note"}, ["Not enough teams to project a bracket."]));
    return wrap;
  }
  var seeds = rows.slice(0,5);
  var rest = rows.slice(5);
  var star = rest.reduce(function(best,r){ return (!best || r.pf>best.pf) ? r : best; }, null);
  seeds.push(star);

  var introLead = isLatest ? "If the season ended today: " : "Based on " + season.league.season + " regular-season standings: ";
  wrap.appendChild(el("div", {class:"analytics-intro"}, [introLead + "the top 5 by record make it, plus " + teamName(star.u) + " (★) as the points-leader wild card. Seeds 1 and 2 get a bye to the semifinals, where 1 faces whichever surviving team ends up the lower seed, and 2 faces the higher remaining seed."]));

  function seedSlot(seed, row){
    return el("div", {class:"bracket-seed" + (seed===6 ? " bracket-seed-wildcard" : "")}, [
      el("span", {class:"bracket-seed-num"}, ["#"+seed]),
      avatarEl(row.u, "sm"),
      el("span", {class:"bracket-seed-name"}, [teamName(row.u)]),
      seed===6 ? el("span",{class:"wildcard-tag wildcard-tag-sm"},["★ WC"]) : null
    ]);
  }
  function tbdSlot(text){
    return el("div", {class:"bracket-seed bracket-tbd"}, [el("span", {class:"bracket-seed-name dim"}, [text])]);
  }
  function byeTag(){
    return el("span", {class:"bye-tag"}, ["BYE"]);
  }

  var qf = el("div", {class:"bracket-col"}, [
    el("div", {class:"bracket-round-label"}, ["Quarterfinals"]),
    el("div", {class:"bracket-match"}, [seedSlot(3,seeds[2]), el("div",{class:"bracket-vs"},["vs"]), seedSlot(6,seeds[5])]),
    el("div", {class:"bracket-match"}, [seedSlot(4,seeds[3]), el("div",{class:"bracket-vs"},["vs"]), seedSlot(5,seeds[4])])
  ]);
  var sf = el("div", {class:"bracket-col"}, [
    el("div", {class:"bracket-round-label"}, ["Semifinals"]),
    el("div", {class:"bracket-match"}, [
      el("div",{class:"bracket-seed"},[el("span",{class:"bracket-seed-num"},["#1"]), avatarEl(seeds[0].u,"sm"), el("span",{class:"bracket-seed-name"},[teamName(seeds[0].u)]), byeTag()]),
      el("div",{class:"bracket-vs"},["vs"]), tbdSlot("Lower remaining seed")
    ]),
    el("div", {class:"bracket-match"}, [
      el("div",{class:"bracket-seed"},[el("span",{class:"bracket-seed-num"},["#2"]), avatarEl(seeds[1].u,"sm"), el("span",{class:"bracket-seed-name"},[teamName(seeds[1].u)]), byeTag()]),
      el("div",{class:"bracket-vs"},["vs"]), tbdSlot("Higher remaining seed")
    ])
  ]);
  var fin = el("div", {class:"bracket-col bracket-col-final"}, [
    el("div", {class:"bracket-round-label"}, ["Championship"]),
    el("div", {class:"bracket-match bracket-match-final"}, [tbdSlot("Winner: Semifinal 1"), el("div",{class:"bracket-vs"},["vs"]), tbdSlot("Winner: Semifinal 2")])
  ]);

  wrap.appendChild(el("div", {class:"bracket"}, [qf, sf, fin]));
  wrap.appendChild(buildBubbleWatch(rest, star));
  return wrap;
}

function buildBubbleWatch(rest, star){
  var wrap = el("div", {style:"margin-top:8px;"});
  wrap.appendChild(el("div", {class:"section-title"}, ["On the Bubble"]));
  var contenders = rest.filter(function(r){ return r.uid !== star.uid; })
    .map(function(r){ return {row:r, gap: star.pf - r.pf}; })
    .sort(function(a,b){ return a.gap - b.gap; });
  if (!contenders.length){
    wrap.appendChild(el("div", {class:"foot-note"}, ["No other teams outside the top 5 yet."]));
    return wrap;
  }
  wrap.appendChild(el("div", {class:"analytics-intro"}, ["How many more points each non-playoff team needs to have scored to leapfrog " + teamName(star.u) + " for the wild card spot, based on points for so far this season. Closest to catching up on the left."]));
  var rowEl = el("div", {class:"bubble-row"});
  contenders.forEach(function(c){
    rowEl.appendChild(el("div", {class:"bubble-card", onclick:function(){ location.hash = "#team/" + c.row.uid; }}, [
      avatarEl(c.row.u, "sm"),
      el("div", {class:"bubble-card-name"}, [teamName(c.row.u)]),
      el("div", {class:"bubble-card-gap"}, ["+" + fmt1(c.gap)]),
      el("div", {class:"bubble-card-note"}, ["pts to catch " + teamName(star.u)])
    ]));
  });
  wrap.appendChild(rowEl);
  return wrap;
}

function getPlayoffWeekStartMap(){
  var map = {};
  STATE.seasons.forEach(function(s){
    map[s.league.season] = (s.league.settings && s.league.settings.playoff_week_start) || null;
  });
  return map;

/* Recompute the Hall of Records from scratch, restricted to either the
   regular season or the postseason. Reuses the per-game entries already
   stored on each user's career.results, plus a fresh all-play pass over the
   raw matchup weeks (for the luck records), filtered to the chosen segment. */
function computeSegmentRecords(segment){
  var pwMap = getPlayoffWeekStartMap();
  function inSegment(season, week){
    var start = pwMap[season];
    var isPost = start != null && week >= start;
    return segment === "post" ? isPost : !isPost;
  }
  function topN(arr, cmp, n){ return arr.slice().sort(cmp).slice(0, n||5); }

  var R = {};
  var seasonSum = {};
  var byUser = {};
  Object.keys(STATE.career).forEach(function(uid){
    byUser[uid] = STATE.career[uid].results.filter(function(r){ return inSegment(r.season, r.week); });
  });

  var highGameArr=[], lowGameArr=[], highCombinedArr=[], blowoutArr=[], nailbiterArr=[], benchWasteArr=[];
  var combinedSeen = {};

  Object.keys(byUser).forEach(function(uid){
    byUser[uid].forEach(function(r){
      highGameArr.push({value:r.pf, uid:uid, opp:r.opp, season:r.season, week:r.week});
      if (r.pf > 0) lowGameArr.push({value:r.pf, uid:uid, opp:r.opp, season:r.season, week:r.week});
      var combined = r.pf + r.pa;
      if (combined > 0){
        var pairKey = r.season + "-" + r.week + "-" + [uid, r.opp].sort().join(",");
        if (!combinedSeen[pairKey]){
          combinedSeen[pairKey] = true;
          highCombinedArr.push({value:combined, uidA:uid, uidB:r.opp, season:r.season, week:r.week});
        }
      }
      if (r.pf !== r.pa){
        var margin = r.pf - r.pa;
        if (margin > 0){
          blowoutArr.push({value:margin, winner:uid, loser:r.opp, season:r.season, week:r.week, winPts:r.pf, losePts:r.pa});
          nailbiterArr.push({value:margin, winner:uid, loser:r.opp, season:r.season, week:r.week, winPts:r.pf, losePts:r.pa});
        }
      }
      seasonSum[uid] = seasonSum[uid] || {};
      seasonSum[uid][r.season] = (seasonSum[uid][r.season]||0) + r.pf;
      if (r.opt != null){
        var waste = r.opt - r.pf;
        if (waste > 0.01) benchWasteArr.push({value:waste, uid:uid, season:r.season, week:r.week, pf:r.pf, opt:r.opt});
      }
    });
  });

  R.highGame = topN(highGameArr, function(a,b){ return b.value-a.value; });
  R.lowGame = topN(lowGameArr, function(a,b){ return a.value-b.value; });
  R.highCombined = topN(highCombinedArr, function(a,b){ return b.value-a.value; });
  R.blowout = topN(blowoutArr, function(a,b){ return b.value-a.value; });
  R.nailbiter = topN(nailbiterArr, function(a,b){ return a.value-b.value; });
  R.benchWaste = topN(benchWasteArr, function(a,b){ return b.value-a.value; });

  var bestSeasonArr = [];
  Object.keys(seasonSum).forEach(function(uid){
    Object.keys(seasonSum[uid]).forEach(function(season){
      bestSeasonArr.push({value:seasonSum[uid][season], uid:uid, season:season});
    });
  });
  R.bestSeason = topN(bestSeasonArr, function(a,b){ return b.value-a.value; });

  var mostWinsArr=[], mostLossesArr=[], winStreakArr=[], lossStreakArr=[], mostEfficientArr=[];
  Object.keys(byUser).forEach(function(uid){
    var filtered = byUser[uid];
    var wins=0, losses=0, sumPf=0, sumOpt=0, optGames=0;
    var cur=0, curType=null, bestW=0, bestWctx=null, bestL=0, bestLctx=null;
    filtered.forEach(function(r){
      if (r.res==="W") wins++; else if (r.res==="L") losses++;
      sumPf += r.pf;
      if (r.opt != null){ sumOpt += r.opt; optGames++; }
      if (r.res === curType) cur++; else { cur=1; curType=r.res; }
      if (curType==="W" && cur>bestW){ bestW=cur; bestWctx={len:cur,endSeason:r.season,endWeek:r.week}; }
      if (curType==="L" && cur>bestL){ bestL=cur; bestLctx={len:cur,endSeason:r.season,endWeek:r.week}; }
    });
    if (wins) mostWinsArr.push({value:wins, uid:uid});
    if (losses) mostLossesArr.push({value:losses, uid:uid});
    if (bestW) winStreakArr.push({value:bestW, uid:uid, ctx:bestWctx});
    if (bestL) lossStreakArr.push({value:bestL, uid:uid, ctx:bestLctx});
    var minGamesForEff = segment==="post" ? 3 : 10;
    if (optGames >= minGamesForEff && sumOpt > 0) mostEfficientArr.push({value:sumPf/sumOpt, uid:uid});
  });
  R.mostWins = topN(mostWinsArr, function(a,b){ return b.value-a.value; });
  R.mostLosses = topN(mostLossesArr, function(a,b){ return b.value-a.value; });
  R.winStreak = topN(winStreakArr, function(a,b){ return b.value-a.value; });
  R.lossStreak = topN(lossStreakArr, function(a,b){ return b.value-a.value; });
  R.mostEfficient = topN(mostEfficientArr, function(a,b){ return b.value-a.value; });

  // luck: re-run the all-play comparison, but only across weeks in this segment
  var apWins={}, apLosses={}, apTies={};
  STATE.seasons.forEach(function(season){
    Object.keys(season.matchupsByWeek).forEach(function(wk){
      var week = parseInt(wk,10);
      if (!inSegment(season.league.season, week)) return;
      var entries = season.matchupsByWeek[wk].filter(function(e){ return season.rosterOwner[e.roster_id]; });
      var weekScores = entries.map(function(e){
        return {uid: season.rosterOwner[e.roster_id], pts: e.custom_points!=null ? e.custom_points : (e.points||0)};
      }).filter(function(x){ return x.pts > 0; });
      if (weekScores.length < 2) return;
      weekScores.forEach(function(me){
        var w=0,l=0,t=0;
        weekScores.forEach(function(other){
          if (other===me) return;
          if (me.pts>other.pts) w++; else if (me.pts<other.pts) l++; else t++;
        });
        apWins[me.uid]=(apWins[me.uid]||0)+w; apLosses[me.uid]=(apLosses[me.uid]||0)+l; apTies[me.uid]=(apTies[me.uid]||0)+t;
      });
    });
  });
  var luckArr = [];
  Object.keys(byUser).forEach(function(uid){
    var filtered = byUser[uid];
    var wins=0, losses=0, ties=0;
    filtered.forEach(function(r){ if (r.res==="W") wins++; else if (r.res==="L") losses++; else ties++; });
    var gp = wins+losses+ties;
    var apW=apWins[uid]||0, apL=apLosses[uid]||0, apT=apTies[uid]||0;
    var apTotal = apW+apL+apT;
    var minGp = segment==="post" ? 3 : 5;
    var minAp = segment==="post" ? 6 : 10;
    if (gp>=minGp && apTotal>=minAp){
      var actualPct = (wins+0.5*ties)/gp;
      var apPct = (apW+0.5*apT)/apTotal;
      luckArr.push({value:actualPct-apPct, uid:uid, actualPct:actualPct, apPct:apPct});
    }
  });
  R.luckiest = topN(luckArr, function(a,b){ return b.value-a.value; });
  R.unluckiest = topN(luckArr, function(a,b){ return a.value-b.value; });

  return R;
}

async function loadTransactionsForSeason(season){
  var leagueId = season.league.league_id;
  if (STATE.transactionsBySeasonId[leagueId]) return STATE.transactionsBySeasonId[leagueId];
  var jobs = [];
  for (var w=0; w<=18; w++){
    (function(w){
      jobs.push(fetchJSON(API + "/league/" + leagueId + "/transactions/" + w));
    })(w);
  }
  var results = await Promise.all(jobs);
  var all = [];
  results.forEach(function(arr){ if (Array.isArray(arr)) all = all.concat(arr); });
  STATE.transactionsBySeasonId[leagueId] = all;
  return all;
}

/* Turn raw transactions into displayable "moves": each completed waiver or
   free-agent pickup, with any other (failed) bids on that same player that
   week attached as competing offers. */
function buildWaiverMoves(season, transactions){
  var relevant = transactions.filter(function(t){ return t.type === "waiver" || t.type === "free_agent"; });
  var completed = relevant.filter(function(t){ return t.status === "complete"; });
  var failed = relevant.filter(function(t){ return t.status === "failed" && t.type === "waiver"; });

  var failedByPlayerWeek = {};
  failed.forEach(function(t){
    var week = t.leg;
    var addedIds = t.adds ? Object.keys(t.adds) : [];
    addedIds.forEach(function(pid){
      var key = week + "|" + pid;
      (failedByPlayerWeek[key] = failedByPlayerWeek[key] || []).push(t);
    });
  });

  var moves = completed.map(function(t){
    var week = t.leg;
    var rosterId = t.roster_ids && t.roster_ids[0];
    var uid = rosterId != null ? season.rosterOwner[rosterId] : null;
    var addedPids = t.adds ? Object.keys(t.adds) : [];
    var droppedPids = t.drops ? Object.keys(t.drops) : [];
    var bidAmount = (t.settings && t.settings.waiver_bid != null) ? t.settings.waiver_bid : null;
    var competing = [];
    if (t.type === "waiver"){
      addedPids.forEach(function(pid){
        var key = week + "|" + pid;
        (failedByPlayerWeek[key] || []).forEach(function(f){
          var fRosterId = f.roster_ids && f.roster_ids[0];
          var fUid = fRosterId != null ? season.rosterOwner[fRosterId] : null;
          var fAmount = (f.settings && f.settings.waiver_bid != null) ? f.settings.waiver_bid : null;
          competing.push({uid:fUid, amount:fAmount});
        });
      });
      competing.sort(function(a,b){ return (b.amount||0) - (a.amount||0); });
    }
    return {
      id: t.transaction_id, type: t.type, week: week, created: t.created || 0,
      uid: uid, addedPids: addedPids, droppedPids: droppedPids, bidAmount: bidAmount,
      competing: competing
    };
  });

  moves.sort(function(a,b){ return b.created - a.created; });
  return moves;
}

  return overlay;
}

document.addEventListener("keydown", function(e){
  if (txnModalIndex == null || !txnCurrentMoves.length) return;
  if (e.key === "Escape"){ txnModalIndex = null; renderTransactions(); }
  else if (e.key === "ArrowLeft" && txnModalIndex > 0){ txnModalIndex--; renderTransactions(); }
  else if (e.key === "ArrowRight" && txnModalIndex < txnCurrentMoves.length-1){ txnModalIndex++; renderTransactions(); }
});

async function renderTransactions(){
  var app = $("#app");
  app.innerHTML = "";
  if (transactionsSeasonIdx == null) transactionsSeasonIdx = STATE.seasons.length - 1;

  var head = el("div", {class:"panel-head"}, [

    ])
  ]);

    ]);

  var list = el("div", {});

  app.appendChild(list);

  if (txnModalIndex != null && txnModalIndex < moves.length){
    app.appendChild(buildTxnModal(moves, txnModalIndex));
  }
}

function quantile(sortedArr, q){
  var pos = (sortedArr.length - 1) * q;
  var base = Math.floor(pos);
  var rest = pos - base;
  if (sortedArr[base+1] !== undefined) return sortedArr[base] + rest * (sortedArr[base+1] - sortedArr[base]);
  return sortedArr[base];
}

function buildBoxWhiskerPlot(season){
  var data = [];
  season.rosters.forEach(function(r){
    var uid = r.roster_id != null ? season.rosterOwner[r.roster_id] : null;
    var c = STATE.career[uid];
    if (!c) return;
    var vals = c.results.filter(function(x){ return x.season === season.league.season; }).map(function(x){ return x.pf; });
    if (!vals.length) return;
    vals.sort(function(a,b){ return a-b; });
    data.push({
      uid:uid, u:STATE.users[uid], vals:vals,
      min:vals[0], max:vals[vals.length-1],
      q1:quantile(vals,0.25), median:quantile(vals,0.5), q3:quantile(vals,0.75)
    });
  });
  if (!data.length) return el("div", {class:"foot-note"}, ["No scored games yet this season."]);

  var globalMin = Math.min.apply(null, data.map(function(d){ return d.min; }));
  var globalMax = Math.max.apply(null, data.map(function(d){ return d.max; }));
  var pad = (globalMax-globalMin) * 0.12 || 5;
  globalMin = Math.max(0, globalMin - pad);
  globalMax += pad;

  // Scale by a fixed pixels-per-point ratio (clamped to a sane range) so the
  // chart grows taller as the season's scoring spread grows, rather than
  // always stretching whatever range into one fixed-height box.
  var CH = Math.round(Math.max(160, Math.min(480, (globalMax-globalMin) * 2.1)));
  function toTop(v){ return (1 - (v-globalMin)/(globalMax-globalMin)) * CH; }

  data.sort(function(a,b){ return b.median - a.median; });

  var axis = el("div", {class:"boxplot-axis", style:"height:"+CH+"px;"});
  for (var i=0;i<=4;i++){
    var v = globalMin + (globalMax-globalMin) * i/4;
    axis.appendChild(el("div", {class:"boxplot-tick", style:"top:"+((1-i/4)*CH)+"px;"}, [fmt0(v)]));
  }

  var row = el("div", {class:"boxplot-row"});
  data.forEach(function(d){
    var chart = el("div", {class:"boxplot-chart", style:"height:"+CH+"px;"});
    var topMax = toTop(d.max), topMin = toTop(d.min), topQ1 = toTop(d.q1), topQ3 = toTop(d.q3), topMed = toTop(d.median);
    chart.appendChild(el("div", {class:"boxplot-whisker", style:"top:"+topMax+"px;height:"+Math.max(2,(topMin-topMax))+"px;"}));
    chart.appendChild(el("div", {class:"boxplot-cap", style:"top:"+topMax+"px;"}));
    chart.appendChild(el("div", {class:"boxplot-cap", style:"top:"+topMin+"px;"}));
    chart.appendChild(el("div", {
      class:"boxplot-box", style:"top:"+topQ3+"px;height:"+Math.max(2,(topQ1-topQ3))+"px;",
      title: teamName(d.u) + ": max " + fmt1(d.max) + ", Q3 " + fmt1(d.q3) + ", median " + fmt1(d.median) + ", Q1 " + fmt1(d.q1) + ", min " + fmt1(d.min)
    }));
    chart.appendChild(el("div", {class:"boxplot-median", style:"top:"+topMed+"px;"}));
    var col = el("div", {class:"boxplot-col", onclick:function(){ if (d.uid) location.hash = "#team/" + d.uid; }}, [
      chart,
      avatarEl(d.u, "sm"),
      el("div", {class:"boxplot-label"}, [teamName(d.u)])
    ]);
    row.appendChild(col);
  });

  var wrap = el("div", {class:"boxplot-wrap"}, [axis, row]);
  return wrap;
}
